<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <link href="./src/output.css" rel="stylesheet" />
  <title>AIMS2</title>
</head>

<body class="">
  <div id="app" class="bg-stone-800 h-full">
    <div class="p-5 h-full flex flex-col">
      <div class="border-b border-b-slate-600 flex w-full">
        <p class="text-left p-2 text-2xl text-yellow-500">
          AIMS2
        </p>
        <span class="flex-1"></span>
        <button id="new-chat" class="text-white hover:cursor-pointer">
          New Chat
        </button>
      </div>
      <div id="msg-body" class="flex-1 p-2 **:mb-5 w-full overflow-y-scroll">


      </div>
      <div class="border rounded-2xl border-slate-400 text-slate-300 bg-stone-700 flex place-content-evenly p-2">
        <span id="input-loader" class="loader hidden"></span>
        <textarea id="textinput" class="inputbox outline-0 resize-none place-content-center-safe flex-1 pl-3"
          type="text" placeholder="Ask anything..."></textarea>
        <button id="sendBtn" class="inputbox hover:cursor-pointer">
          Send
        </button>
      </div>
    </div>
  </div>


  <template id="message-entry">

    <p class="msg-content text-white text-xl p-4 w-fit max-w-[75%]">

    </p>
  </template>
  <script src="./src/main.js" type="module">

  </script>
</body>

</html>
